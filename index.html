<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Олег Родькин — На Берегах Оби</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --night: #0d1117;
    --deep: #161b22;
    --surface: #1c2333;
    --border: #2d3748;
    --ob: #4a9eff;
    --ob-dim: #2a5a99;
    --gold: #c8a84b;
    --text: #e6edf3;
    --muted: #8b949e;
    --warm: #d4a96a;
  }

  body {
    background: var(--night);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .stars {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.8; } }

  .river {
    position: fixed; bottom: 0; left: 0;
    width: 100%; height: 120px;
    background: linear-gradient(180deg, transparent 0%, rgba(74,158,255,0.06) 50%, rgba(74,158,255,0.12) 100%);
    pointer-events: none; z-index: 0;
  }
  .river::before {
    content: ''; position: absolute; top: 30px; left: -100%;
    width: 300%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(74,158,255,0.3), rgba(74,158,255,0.5), rgba(74,158,255,0.3), transparent);
    animation: flow 8s linear infinite;
  }
  .river::after {
    content: ''; position: absolute; top: 55px; left: -100%;
    width: 300%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(74,158,255,0.2), rgba(74,158,255,0.4), rgba(74,158,255,0.2), transparent);
    animation: flow 12s linear infinite reverse;
  }
  @keyframes flow { from { transform: translateX(0); } to { transform: translateX(33.33%); } }

  .wrap {
    position: relative; z-index: 1;
    max-width: 720px; margin: 0 auto;
    padding: 60px 24px 140px;
  }

  header { text-align: center; margin-bottom: 56px; }
  .city-tag {
    display: inline-block; font-size: 11px; font-weight: 500;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--ob); margin-bottom: 20px; opacity: 0.8;
  }
  .album-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 700; line-height: 1.1;
    color: var(--text); margin-bottom: 8px;
  }
  .album-title span { color: var(--ob); }
  .artist-name {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 18px;
    color: var(--warm); margin-bottom: 24px;
  }
  .album-desc {
    font-size: 14px; color: var(--muted); line-height: 1.7;
    max-width: 420px; margin: 0 auto;
  }

  .divider { display: flex; align-items: center; gap: 16px; margin: 40px 0; }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border));
  }
  .divider::after { background: linear-gradient(90deg, var(--border), transparent); }
  .divider-icon { color: var(--ob-dim); font-size: 18px; }

  .playlist { display: flex; flex-direction: column; gap: 12px; margin-bottom: 56px; }

  .track-card {
    background: var(--deep);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .track-card.active {
    border-color: var(--ob-dim);
    box-shadow: 0 0 0 1px rgba(74,158,255,0.15), 0 8px 24px rgba(0,0,0,0.35);
  }

  .track-row {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    cursor: pointer;
  }

  .track-num {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--muted);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .track-card.active .track-num { background: var(--ob); color: white; }

  .track-row-info { flex: 1; min-width: 0; }
  .track-row-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 700;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .track-mini-play {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .track-card.active .track-mini-play { background: var(--ob); border-color: var(--ob); }
  .track-mini-play svg { width: 14px; height: 14px; fill: var(--muted); }
  .track-card.active .track-mini-play svg { fill: white; }

  .lyrics-toggle {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
    color: var(--muted);
    transition: transform 0.25s, color 0.2s;
  }
  .lyrics-toggle.open { transform: rotate(180deg); color: var(--ob); }
  .lyrics-toggle svg { width: 16px; height: 16px; }

  .track-expand { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
  .track-expand.open { max-height: 2000px; transition: max-height 0.6s ease; }

  .expand-inner { padding: 0 20px 24px; border-top: 1px solid var(--border); }

  .audio-wrap {
    background: var(--surface);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    margin-top: 20px;
  }

  .play-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--ob); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 4px 12px rgba(74,158,255,0.35);
  }
  .play-btn:hover { transform: scale(1.08); background: #5baeff; }
  .play-btn svg { width: 16px; height: 16px; fill: white; }

  .progress-area { flex: 1; }
  .progress-bar {
    width: 100%; height: 4px;
    background: var(--border); border-radius: 2px;
    cursor: pointer; margin-bottom: 6px;
    position: relative; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ob), var(--gold));
    border-radius: 2px; width: 0%;
    transition: width 0.1s linear;
  }
  .time-row {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .lyrics-block { margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--border); }
  .section-label-mini {
    font-size: 10px; font-weight: 500; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 16px;
  }
  .lyric-part { margin-bottom: 22px; }
  .lyric-part:last-child { margin-bottom: 0; }
  .part-label {
    font-size: 10px; font-weight: 500; letter-spacing: 2px;
    text-transform: uppercase; color: var(--ob);
    margin-bottom: 8px; opacity: 0.7;
  }
  .lyric-lines {
    font-family: 'Playfair Display', serif;
    font-size: 15px; line-height: 1.8;
    color: var(--text); font-style: italic;
  }
  .lyric-lines .chorus-line { color: var(--warm); font-weight: 700; font-style: normal; }

  .no-lyrics { font-size: 13px; color: var(--muted); font-style: italic; padding: 8px 0; }

  footer { text-align: center; margin-top: 64px; padding-top: 32px; border-top: 1px solid var(--border); }
  .footer-text { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .footer-text strong { color: var(--warm); font-weight: 500; }
  .ob-line { color: var(--ob); font-size: 18px; margin-top: 12px; opacity: 0.4; letter-spacing: 8px; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="river"></div>

<div class="wrap">

  <header>
    <div class="city-tag">Нижневартовск · Обь · 2026</div>
    <h1 class="album-title">На Берегах <span>Оби</span></h1>
    <div class="artist-name">Олег Родькин</div>
    <p class="album-desc">Альбом о жизни, которую проживаешь — не придумываешь. Нижневартовск, Самотлор, близкие люди — то, что всегда рядом.</p>
  </header>

  <div class="divider"><span class="divider-icon">〜</span></div>

  <div class="playlist" id="playlist"></div>

  <footer>
    <div class="footer-text">
      <strong>Олег Родькин</strong> · Нижневартовск<br>
      Самотлор · Слесарь КИПиА
    </div>
    <div class="ob-line">〜 〜 〜</div>
  </footer>

</div>

<script>
  const tracks = [
    {
      title: "Над синей рекою",
      meta: "Нижневартовск · 2026",
      src: "https://raw.githubusercontent.com/romoleg-1972/music/main/belye-noci-audio.mp3",
      lyrics: [
        { label: "Куплет 1", lines: `Там, где дороги сошлись на кургане,<br>Где Самотлор зажигал свои вышки,<br>Город рождался в суровом тумане,<br>Парни на стройке, двухсотка и вспышка!<br>Шло девятое СМУ сквозь глухую тайгу,<br>Вбило первые сваи в седую марь…<br>Этот край на холодном обском берегу<br>Стал для тысяч людей как родной алтарь.` },
        { label: "Припев", lines: `<span class="chorus-line">Мой белый город над синей рекою,</span><br><span class="chorus-line">Где белые ночи не знают покоя!</span><br>Мы помним тех первых, что шли сквозь метели,<br>Чтоб здесь, на болотах, дома зашумели.<br><span class="chorus-line">Нижневартовск — ты память, ты факел во мгле,</span><br><span class="chorus-line">Спасибо, «Алёша», поклоны земле.</span>` },
        { label: "Куплет 2", lines: `Там, за домами — бескрайнее море,<br>Дикое болото и кедров простор.<br>Рассвет растворяет туман на озёрах,<br>Вплетая свой голос в лесной разговор.<br>А из рук великана на стыке дорог<br>Вечный огонь согревает рассвет.<br>Каждый, кто вырос здесь, точно бы смог<br>В сердце оставить свой искренний след.` },
        { label: "Бридж", lines: `Уходили года, открывались капсулы времени,<br>Но остался тот дух, что вовек не согнуть.<br>Вартовчане одной нерушимой семьёй<br>Продолжают свой светлый и правильный путь!` }
      ]
    },
	
    { title: "Лента времени",
      meta: "Нижневартовск · 2026",
      src: "https://raw.githubusercontent.com/romoleg-1972/music/main/02-lenta-vremeni-audio.mp3",
      lyrics: [
		{ label: "Вступление", lines: `Эти двадцать минут с хвостиком — всегда самые тягучие...<br>Ты уже мысленно одной ногой в домашних тапках,<br>а стрелка часов будто назло замедляется.<br>Самое время навести финальный порядок,<br>закрыть все вкладки...<br>и просто спокойно посидеть на дорожку.` },
		{ label: "Куплет 1", lines: `Крутится лента, стирая прошедшие дни,<br>В студии душной у парка зажглись огни.<br>Жизнь предлагала развилку и два пути,<br>Сердце металось — по какой дороге идти?<br><br>Но рок или случай черту провели впотьмах,<br>Судьба расставила точки в моих узлах.<br>Сквозь боль утраты, сквозь оборванный тонкий след,<br>Век девяносто седьмой мне принёс ответ.` },
		{ label: "Куплет 2 — Встреча", lines: `Постовая будка, друг на ночном посту,<br>Я на «Москвиче» разрезаю темноту.<br>Мимо витрин, сквозь город и пустоту,<br>В огнях ночных мелькнули силуэты.<br>Случайная встреча нарушила запреты,<br>Первая ночь — скромно, в разных углах,<br>А стрелки застыли на часах.` },
		{ label: "Куплет 3 — Семья", lines: `Девочка с Урала в Сибирском краю,<br>Связала навечно дорогу свою.<br>Свадьбу сыграли в кругу родни,<br>В родительских стенах пошли дни.<br>Планы строили в вихре перемен,<br>Шагнули за рамки этих стен.<br>Своя однушка, ключи на столе...<br>Так заземлились на этой земле.` },
		{ label: "Финал", lines: `Крутится лента...<br>Студия у парка...<br>Сквозь тонкий след...<br>Застывшие стрелки часов...<br>Наша однушка.<br><br>Да...<br>Время летит, лента крутится.<br>Но иногда нужно просто застыть.<br>Снять все эти роли, закрыть вкладки...<br>И просто побыть собой.<br><br>Ну что...<br>Посидим на дорожку?<br>И домой.<br>В тишину.` }

	{ title: "Железные сердца",
      meta: "Нижневартовск · 2026",
      src: "https://raw.githubusercontent.com/romoleg-1972/music/main/07-zeleznye-serdca-audio.mp3",
      lyrics: [
		{ label: "Вступление", lines: `Мужчины очень редко плачут.<br>Но когда они плачут — это очень страшные слёзы.<br>Или их сердца растаяли... железные сердца...<br>Или же они сгорели.<br>Одна душа. Два исхода...` },
		{ label: "Куплет 1", lines: `Он не гнулся под ветром, когда хоронил отца,<br>Он держал под прицелом удары чужого свинца.<br>Но броня расплавилась, перестав быть бронёй,<br>Когда дочка шепнула простые слова: «Папа».<br>Папа.<br>Это не было слабостью, крахом, бедой —<br>Просто сталь уступила, став просто тёплой водой.<br>Предел прочности сбит не обломками чьих-то обид,<br>А теплом, от которого не нужно больше быть сталью.<br>Сталью.` },
		{ label: "Бридж", lines: `А всё остальное... мужчины обычно молчат.` },
		{ label: "Куплет 2", lines: `Говорят, это статус и опора, характер и сталь.<br>Говорят, что железо не знает, что значит печаль.<br>Но когда на исходе догорел твой ресурс вконец,<br>И трещит та броня, под которой горел рубец —<br>Включается прочность уставших, но выживших наших сердец.<br>Годами этот аврал, и эта вечная в жилах страда,<br>На этих широких плечах замерзают чужие года.<br>Где столько рубцов под осевшей золой, где сгорает броня дотла,<br>На этом железе живого места уже не дано...<br>Живая вода испарилась.<br>Остался только пепел.` },

	{ title: "Теплый ветер дворов",
      meta: "Нижневартовск · 2026",
      src: "https://raw.githubusercontent.com/romoleg-1972/music/main/teplyi-veter-dvorov-audio.mp3",
      lyrics: [
		{ label: "Куплет 1", lines: `Время стирает краску на старых стенах,<br>Год пролетает за годом, меняя лица.<br>Память пульсирует где-то в остывших венах,<br>И этот город мне снова и снова снится.<br><br>Квадратный двор, где асфальт от дождей темнеет,<br>И силуэты окон в вечернем свете…<br>Там мы взрослели, ловя старых улиц эхо,<br>Пока шумел во дворе этот тёплый ветер.` },

		{ label: "Куплет 3", lines: `И вот уже новые ножки по лужам топочут,<br>Маленькие ладошки доверчиво греют мне руку.<br>Сменяются годы, и дни улетают в рассветы и ночи,<br>Но в этом кружении нет места тоске или испугу.<br><br>Ведь каждый этап — как один золотой поворот,<br>Он неповторим, и не нужно листать календарь...<br>Музыка тихим дождём продолжает капать,<br>Время, пожалуйста, тише… Его не торопите.` }

			]

	{ title: "Дом там, где...",

      lyrics: [

      lyrics: [

		{ label: "Куплет 1", lines: `Вдоль берегов Оби туман ложится густо,<br>Я шёл по жизни так, как чувствовал и знал.<br>Внутри порой бывало холодно и пусто,<br>Но я за правду, как за поручень, держал.<br>Я не умел дарить слова и обещанья,<br>Любовь свою ковал в металле и кодах.<br>Прости, родная, за минуты не-вниманья,<br>За то, что вечно в мыслях, в планах и делах.` },
		{ label: "Куплет 2", lines: `А я твой сильный нрав без лишних слов читала,<br>И знала, что за кодом прячется тепло.<br>Я просто ждала, верила, прощала,<br>Когда в чертёж уткнувшись, время шло.<br>И в ту минуту, когда небо потемнело,<br>И маму мы в последний путь вели,<br>Рука моя в твоей руке онемела,<br>Чтоб эту боль мы вместе пронести смогли.` },
		{ label: "Припев", lines: `<span class="chorus-line">Я им дарю теперь истории свои,</span><br><span class="chorus-line">А дети выросли, у каждого свой взлёт...</span><br><span class="chorus-line">Пусть нет на том пути бескрайней соловьи,</span><br><span class="chorus-line">Но наше сердце никогда не врёт.</span>` },
		{ label: "Куплет 3", lines: `Ты думал, мало обнимал их — это мнится,<br>Они ведь видели твой честный, трудный путь.<br>Теперь летят в ладонях северной столицы,<br>И верности твоей с дороги не свернуть.` },
		{ label: "Куплет 4", lines: `Пусть я не свят, и за спиной мосты горят,<br>И метит время шрамом душу, как ножом.<br>Но дети в Питере — они мой тихий сад,<br>Мой чистый берег, мой далёкий светлый дом.` },
		{ label: "Аутро", lines: `Я дотяну, отполирую, доживу,<br>Смахну с тяжёлых плеч ненужный груз обид...<br>И всё, что снилось нам когда-то наяву,<br>Останется святым на берегах Оби.` }
		]
    },
    {
      title: "Спасибо тем, кто верил и любил! (кавер)",
      meta: "Нижневартовск · 2026",
      src: "https://raw.githubusercontent.com/romoleg-1972/music/main/spasibo-tem-kto-veril-audio.mp3",
      lyrics: [
		{ label: "Куплет 1", lines: `Спасибо тем, кто верил и любил!<br>Кто был в моей судьбе, а не казался...<br>Кто просто так, хоть изредка, звонил...<br>Кто в памяти моей навек остался<br>Лучом тепла.` },
		{ label: "Куплет 2", lines: `Кто в горе не ушёл<br>И, что важнее, в радости не бросил.<br>Кто рядом был не телом, но душой...<br>Кто все мои нелепые вопросы<br>Выслушивал, пытаясь дать ответ,<br>Совет... да, что угодно... просто слушал<br>И слышал.` },
		{ label: "Куплет 3", lines: `Тем, кто, зная много лет,<br>Мою не предал и не продал душу.<br>Спасибо тем, кто честен за спиной.<br>С кем можно быть без масок и без грима...<br>Спасибо, каждый ангел мой земной,<br>За то, что вами жизнь моя хранима!` }
		]
    }
  ];

  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.5;
    s.style.cssText = `width:${size}px; height:${size}px; left:${Math.random()*100}%; top:${Math.random()*70}%; --d:${2+Math.random()*4}s; animation-delay:${Math.random()*4}s;`;
    starsEl.appendChild(s);
  }

  const pauseSVG = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
  const playSVG = `<path d="M8 5v14l11-7z"/>`;
  const chevronSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>`;

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60);
    return `${m}:${sec<10?'0':''}${sec}`;
  }

  const playlistEl = document.getElementById('playlist');
  let currentlyPlayingAudio = null;

  tracks.forEach((track, i) => {
    const card = document.createElement('div');
    card.className = 'track-card';

    const lyricsHtml = track.lyrics.length
      ? track.lyrics.map(p => `
          <div class="lyric-part">
            <div class="part-label">${p.label}</div>
            <div class="lyric-lines">${p.lines}</div>
          </div>
        `).join('')
      : `<div class="no-lyrics">Текст появится позже</div>`;

    card.innerHTML = `
      <div class="track-row" data-toggle="${i}">
        <div class="track-num">${String(i+1).padStart(2,'0')}</div>
        <div class="track-row-info">
          <div class="track-row-title">${track.title}</div>
          <div class="track-row-meta">${track.meta}</div>
        </div>
        <div class="track-mini-play" data-play="${i}">
          <svg viewBox="0 0 24 24" id="mini-icon-${i}">${playSVG}</svg>
        </div>
        <div class="lyrics-toggle" data-toggle="${i}" id="chevron-${i}">${chevronSVG}</div>
      </div>
      <div class="track-expand" id="expand-${i}">
        <div class="expand-inner">
          <div class="audio-wrap">
            <button class="play-btn" data-play="${i}">
              <svg viewBox="0 0 24 24" id="big-icon-${i}">${playSVG}</svg>
            </button>
            <div class="progress-area">
              <div class="progress-bar" id="bar-${i}">
                <div class="progress-fill" id="fill-${i}"></div>
              </div>
              <div class="time-row">
                <span id="current-${i}">0:00</span>
                <span id="duration-${i}">—</span>
              </div>
            </div>
          </div>
          <audio id="audio-${i}" preload="metadata" src="${track.src}"></audio>
          <div class="lyrics-block">
            <div class="section-label-mini">Текст песни</div>
            ${lyricsHtml}
          </div>
        </div>
      </div>
    `;
    playlistEl.appendChild(card);

    const audio = card.querySelector(`#audio-${i}`);
    const expand = card.querySelector(`#expand-${i}`);
    const chevron = card.querySelector(`#chevron-${i}`);
    const fill = card.querySelector(`#fill-${i}`);
    const currentEl = card.querySelector(`#current-${i}`);
    const durationEl = card.querySelector(`#duration-${i}`);
    const bar = card.querySelector(`#bar-${i}`);
    const miniIcon = card.querySelector(`#mini-icon-${i}`);
    const bigIcon = card.querySelector(`#big-icon-${i}`);

    card.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => {
        const isOpen = expand.classList.contains('open');
        expand.classList.toggle('open', !isOpen);
        chevron.classList.toggle('open', !isOpen);
      });
    });

    function togglePlay() {
      if (currentlyPlayingAudio && currentlyPlayingAudio !== audio) {
        currentlyPlayingAudio.pause();
      }
      if (audio.paused) {
        audio.play();
        currentlyPlayingAudio = audio;
        miniIcon.innerHTML = pauseSVG;
        bigIcon.innerHTML = pauseSVG;
        card.classList.add('active');
        if (!expand.classList.contains('open')) {
          expand.classList.add('open');
          chevron.classList.add('open');
        }
      } else {
        audio.pause();
        miniIcon.innerHTML = playSVG;
        bigIcon.innerHTML = playSVG;
      }
    }

    card.querySelectorAll('[data-play]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePlay();
      });
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = fmt(audio.duration);
    });
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        currentEl.textContent = fmt(audio.currentTime);
      }
    });
    audio.addEventListener('ended', () => {
      miniIcon.innerHTML = playSVG;
      bigIcon.innerHTML = playSVG;
      fill.style.width = '0%';
      currentEl.textContent = '0:00';
      card.classList.remove('active');
    });
    bar.addEventListener('click', (e) => {
      const rect = bar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });
  });

  document.getElementById('expand-0').classList.add('open');
  document.getElementById('chevron-0').classList.add('open');
</script>

</body>
</html>
