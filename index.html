<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Над синей рекой — Олег</title>
    <style>
        /* Дизайн страницы: темный фон, текст по центру */
        body {
            background-color: #111827; /* Темно-синий/черный цвет */
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .player-card {
            background-color: #1f2937;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #60a5fa; /* Голубой цвет, как река */
            font-size: 28px;
            margin-bottom: 5px;
        }
        h2 {
            color: #9ca3af;
            font-size: 18px;
            font-weight: normal;
            margin-top: 0;
        }
        /* Стилизация плеера */
        audio {
            width: 100%;
            margin-top: 30px;
            border-radius: 8px;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h1>Над синей рекой</h1>
        <h2>Белые ночи</h2>
        
        <!-- Плеер берет файл из той же папки -->
        <audio controls>
            <source src="belye-noci-audio.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио.
        </audio>

        <div class="footer">
            Самотлор · Нижневартовск
        </div>
    </div>

</body>
</html>
